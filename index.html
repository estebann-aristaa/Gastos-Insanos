<!doctype html>
<html lang="es">

    <!-- Tema visual (barra de estado / navegador) -->
    <meta name="theme-color" content="#0B0E11" />

    <!-- iOS: permite abrir como app de pantalla completa al agregarla al inicio -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Manifest (Android / Chrome, y referencia general) -->
    <link rel="manifest" href="/manifest.json" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

      html, body, #root { height: 100%; margin: 0; background: #0B0E11; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    </style>
  </head>

    <script type="module" src="/src/main.jsx"></script>
